name: Blocked-By sweep

on:
  # Pull requests run the tests only. Without this the sweep's own suite never
  # gates a change to it: a PR could break the parser and nothing would fail
  # until the next cron fired, in a run nobody is watching.
  pull_request:
    paths:
      - "docs/ai-team/scripts/**"
      - ".github/workflows/blocked-by-sweep.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blocked-by-sweep
  cancel-in-progress: false

jobs:
  test:
    name: Test the sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the sweep
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Blocked-By sweep
        run: python3 -m unittest discover -s docs/ai-team/scripts -p 'test_*.py'

  sweep:
    name: Unblock resolved tasks
    needs: test
    # Never on a pull request: this step edits issues, and a PR has no business
    # doing that. `issues: write` is scoped to this job alone rather than the
    # whole workflow, so the test job cannot write even by accident.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out the sweep
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Blocked-By sweep
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 docs/ai-team/scripts/blocked_by_sweep.py
