name: review-gate

# Merge gate for independent agent review (issue #198, Discussion #196).
#
# Two jobs with different trust levels:
#
#   fixtures — runs the PR's own gate code against the fixture suite, so
#              changes to the gate are tested like any other change.
#   gate     — evaluates the PR's approvals using the gate script resolved
#              from the DEFAULT BRANCH, never from the PR head. A PR must not
#              be able to approve itself by editing the gate. Until the script
#              exists on main, the gate job skips green.
#
# Both identity checks live in scripts/review_gate.sh; this file is only
# trigger wiring. Making the "Independent review present" check required in
# branch protection is a repo-settings step done separately.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

jobs:
  fixtures:
    name: Gate fixture suite
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fixtures
        run: |
          if [ -d scripts/test/review_gate ]; then
            scripts/test/review_gate/run.sh
          else
            echo "no review-gate fixtures in this change; skipping"
          fi

  gate:
    name: Independent review present
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Resolve gate script from the default branch
        id: resolve
        run: |
          git fetch --depth=1 origin main
          if git cat-file -e origin/main:scripts/review_gate.sh 2>/dev/null; then
            git show origin/main:scripts/review_gate.sh > "$RUNNER_TEMP/review_gate.sh"
            chmod +x "$RUNNER_TEMP/review_gate.sh"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Evaluate independent approval
        if: steps.resolve.outputs.present == 'true'
        # `review_gate.sh` exits non-zero on FAIL, and that exit code is the
        # entire point of this job. The explicit shell makes the pipeline
        # propagate the gate's status through `tee`.
        shell: bash -eo pipefail {0}
        run: |
          "$RUNNER_TEMP/review_gate.sh" "$PR_NUMBER" | tee "$GITHUB_STEP_SUMMARY"
      - name: Gate not yet installed
        if: steps.resolve.outputs.present == 'false'
        run: |
          echo "review gate script is not on main yet; nothing to evaluate" >> "$GITHUB_STEP_SUMMARY"
