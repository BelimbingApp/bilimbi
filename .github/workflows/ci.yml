name: CI

on:
  pull_request:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pull requests keep cancelling their own superseded runs -- `github.ref` is
  # `refs/pull/<n>/merge`, so each PR has its own group.
  #
  # Pushes to `main` must not. Every merge shares the group
  # `ci-CI-refs/heads/main`, so with this set to `true` each merge cancelled the
  # previous merge's run: six merges in eight minutes left five cancelled runs
  # and one survivor (#389). The push run is the only thing that tests the tree
  # merging actually produced -- the PR's own run tested its branch, not the
  # combination -- so cancelling it means a bad merge between two good ones
  # leaves no trace.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ERL_COMPILER_OPTIONS: deterministic
  MIX_ENV: test

jobs:
  quality:
    name: Elixir quality
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.3"
          version-type: strict

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-beam-quality-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Verify formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      # The step above does NOT gate path-dependency modules: --warnings-as-errors
      # applies to the current project, and every module compiles as a dependency
      # of the root. A missing required attr warned and exited 0 (#176). Compiling
      # each module in its own project context is what makes those warnings fatal.
      # The root alias compiles every discovered module, mounted ones included,
      # and the Web host. Discovery does not list the host.
      - name: Compile each module strictly
        run: mix compile.strict

      - name: Run Credo
        run: >-
          mix credo --strict "apps/**/*.{ex,exs}"
          --ignore-checks AliasUsage,Apply,CyclomaticComplexity,LineEndings,Nesting

      - name: Enforce greppable AGENTS.md mandates
        run: .github/scripts/mandates.sh

      - name: Check deployment adapters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/setup-native.sh scripts/setup-docker.sh scripts/deploy/*.sh rel/env.sh.eex
          bash scripts/deploy/test-setup.sh

      - name: Audit known dependency vulnerabilities
        run: mix deps.audit

      - name: Audit retired Hex packages
        run: mix hex.audit

      - name: Verify declared module-graph edges
        run: |
          elixir .github/scripts/graph_edges.exs --self-test
          elixir .github/scripts/graph_edges.exs

      - name: Scan Phoenix security across all applications
        run: .github/scripts/sobelow_modules.sh

  # Every other job builds the Platform alone, so a Platform migration that
  # reuses a version a Domain already ships passes them and is refused only
  # when a composition mounts both. This job mounts each public first-party
  # Domain at its default branch and checks migration versions alone, so a
  # Domain that is behind the Platform in other ways does not fail it. The
  # daily schedule catches a Domain that takes a version the Platform ships.
  # The Domain list is hard-coded because nothing in this repository names the
  # remote first-party Domains: discovery sees only directories already mounted
  # under apps/domains. A new public first-party Domain must be added to it.
  domain_migration_versions:
    name: First-party Domain migration versions
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.3"
          version-type: strict

      - name: Mount the public first-party Domains
        run: |
          for domain in factory finance people people_connector supply_chain; do
            git clone --quiet --depth 1 \
              "https://github.com/BelimbingApp/b-dom-${domain//_/-}.git" "apps/domains/$domain"
          done

      - name: Check migration versions are unique across the composition
        run: >-
          elixir -r mix/composition_lock.exs
          -r apps/base/module_registry/mix/module_discovery.exs
          -e 'Bilimbi.Base.ModuleRegistry.MixDiscovery.validate_migration_versions!(".")'

  types:
    name: Elixir types
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      MIX_ENV: dev

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.3"
          version-type: strict

      - name: Restore Dialyzer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/dev
            ~/.mix
          key: ${{ runner.os }}-beam-dialyzer-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-dialyzer-

      - name: Install dependencies
        run: mix deps.get

      # Cached PLTs include local path packages. Their exports can change
      # without a mix.lock change, so refresh them before either analysis.
      - name: Run the existing host Dialyzer check
        env:
          BILIMBI_DIALYZER_SCOPE: host
        run: mix dialyzer --force-check --format github

      # The package analysis includes source-loaded composition helpers.
      - name: Check module-package Dialyzer warnings
        env:
          BILIMBI_DIALYZER_SCOPE: packages
        run: mix dialyzer --force-check --format github

  compatibility_paths:
    name: Check compatibility test paths
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ steps.paths.outputs.run }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check compatibility-sensitive paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '(^|/)priv/repo/migrations/|(^|/)bilimbi\.module\.exs$|^apps/core/compatibility/|^apps/base/module_registry/|^mix\.lock$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  compatibility:
    name: Elixir compatibility tests
    needs: compatibility_paths
    if: ${{ always() && (github.event_name != 'pull_request' || needs.compatibility_paths.outputs.run == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      BILIMBI_E2E_PARENT_COMMAND: mix test
      PGHOST: localhost
      PGPASSWORD: bilimbi_dev_ca658ad7d8b5
      PGPORT: "5432"
      PGUSER: bilimbi

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: bilimbi_dev_ca658ad7d8b5
          POSTGRES_USER: bilimbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bilimbi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.3"
          version-type: strict

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-beam-tests-compatibility-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-tests-

      - name: Install dependencies
        run: mix deps.get

      - name: Verify formatting
        run: mix format --check-formatted

      - name: Run compatibility tests
        id: compatibility
        env:
          BILIMBI_E2E_DIAGNOSTICS_DIR: ${{ runner.temp }}/bilimbi-e2e-diagnostics
        run: mix precommit.test.compatibility

      - name: Upload PlatformBaseline failure diagnostics
        if: ${{ failure() && steps.compatibility.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-baseline-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bilimbi-e2e-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9
          include-hidden-files: false

      - name: Verify the test suite made no changes
        run: git diff --exit-code

  web_tests:
    name: Elixir Web tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      PGHOST: localhost
      PGPASSWORD: bilimbi_dev_ca658ad7d8b5
      PGPORT: "5432"
      PGUSER: bilimbi

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: bilimbi_dev_ca658ad7d8b5
          POSTGRES_USER: bilimbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bilimbi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.3"
          version-type: strict

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-beam-tests-web-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-tests-

      - name: Install dependencies
        run: mix deps.get

      - name: Verify formatting
        run: mix format --check-formatted

      - name: Restore asset tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/tailwind-*
            _build/esbuild-*
            ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-asset-tools-${{ hashFiles('config/config.exs', 'apps/web/assets/package-lock.json') }}

      - name: Install Tailwind
        run: (cd apps/web && mix tailwind.install --if-missing)

      - name: Install esbuild
        run: (cd apps/web && mix esbuild.install --if-missing)

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Test mounted LiveView hooks
        run: mix assets.test

      - name: Run the Web tests
        run: mix precommit.test.web

      - name: Verify module contributions
        run: mix bilimbi.contributions.verify

      - name: Verify the test suite made no changes
        run: git diff --exit-code

  package_tests:
    name: Elixir package tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      PGHOST: localhost
      PGPASSWORD: bilimbi_dev_ca658ad7d8b5
      PGPORT: "5432"
      PGUSER: bilimbi

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: bilimbi_dev_ca658ad7d8b5
          POSTGRES_USER: bilimbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bilimbi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.3"
          version-type: strict

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-beam-tests-packages-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-tests-

      - name: Install dependencies
        run: mix deps.get

      - name: Verify dependency lock is complete
        run: mix deps.unlock --unused

      - name: Verify formatting
        run: mix format --check-formatted

      - name: Run the package tests
        run: mix precommit.test.packages

      - name: Verify the test suite made no changes
        run: git diff --exit-code

  # Branch protection requires the check named `Elixir tests`. The test jobs
  # above report under their own names, so this aggregate keeps that check.
  # `always()` stops a skipped dependency from skipping this job, which would
  # read as a green required check. A skip counts only when the path gate ran
  # and said `run=false`; a failed or cancelled job always fails the gate.
  tests:
    name: Elixir tests
    if: ${{ always() }}
    needs: [compatibility_paths, compatibility, web_tests, package_tests]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Require each test job to pass or be skipped by its path gate
        env:
          GATE_RESULT: ${{ needs.compatibility_paths.result }}
          GATE_RUN: ${{ needs.compatibility_paths.outputs.run }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          WEB_TESTS_RESULT: ${{ needs.web_tests.result }}
          PACKAGE_TESTS_RESULT: ${{ needs.package_tests.result }}
        run: |
          failed=0

          case "$COMPATIBILITY_RESULT" in
            success) ;;
            skipped)
              if [ "$GATE_RESULT" != success ] || [ "$GATE_RUN" != false ]; then
                echo "::error::compatibility was skipped, but its path gate did not clear it"
                failed=1
              fi
              ;;
            *)
              echo "::error::compatibility finished with result: $COMPATIBILITY_RESULT"
              failed=1
              ;;
          esac

          for entry in "web_tests=$WEB_TESTS_RESULT" "package_tests=$PACKAGE_TESTS_RESULT"; do
            if [ "${entry#*=}" != success ]; then
              echo "::error::${entry%%=*} finished with result: ${entry#*=}"
              failed=1
            fi
          done

          exit "$failed"

  first_build:
    name: Elixir first-build routes
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    env:
      MIX_ENV: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.3"
          version-type: strict

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: ${{ runner.os }}-beam-first-build-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      # Regression for issue #136: RouteContract bakes @routes at compile time
      # from the route manifest written by the :bilimbi_graph compiler. On a
      # clean first build the manifest must exist in _build/<env>/ before
      # base/ui compiles, otherwise RouteContract and DiscoveredRoutes bake an
      # empty route table. Deleting _build/test forces that ordering.
      - name: Clean build artifacts
        run: rm -rf _build/test

      - name: Compile from clean
        run: mix compile --warnings-as-errors

      - name: Verify first-build route manifest
        run: |
          mix run --no-start --no-compile -e '
            router_paths = BilimbiWeb.Router.__routes__() |> Enum.map(& &1.path)

            unless "/system/sessions" in router_paths do
              raise "first-build regression: /system/sessions missing from BilimbiWeb.Router.__routes__/0"
            end

            unless "/tenancy/tenants" in router_paths do
              raise "first-build regression: /tenancy/tenants missing from BilimbiWeb.Router.__routes__/0"
            end

            unless Bilimbi.Base.UI.RouteContract.verified_route?([], ["system", "sessions"]) do
              raise "first-build regression: RouteContract.verified_route?/2 did not match /system/sessions"
            end

            unless Bilimbi.Base.UI.RouteContract.verified_route?([], ["tenancy", "tenants"]) do
              raise "first-build regression: RouteContract.verified_route?/2 did not match /tenancy/tenants"
            end

            IO.puts("first-build route manifest regression: OK")
          '
