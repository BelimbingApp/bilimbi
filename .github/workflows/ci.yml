name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ERL_COMPILER_OPTIONS: deterministic
  MIX_ENV: test

jobs:
  quality:
    name: Elixir quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.3"
          version-type: strict

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-beam-quality-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Verify formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: >-
          mix credo --strict "apps/**/*.{ex,exs}"
          --ignore-checks AliasUsage,Apply,CyclomaticComplexity,LineEndings,Nesting

      - name: Audit known dependency vulnerabilities
        run: mix deps.audit

      - name: Audit retired Hex packages
        run: mix hex.audit

      - name: Scan Phoenix security
        run: mix sobelow --root apps/web --private --exit medium

  types:
    name: Elixir types
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      MIX_ENV: dev

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.3"
          version-type: strict

      - name: Restore Dialyzer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/dev
            ~/.mix
          key: ${{ runner.os }}-beam-dialyzer-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer --format github

  tests:
    name: Elixir tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      PGHOST: localhost
      PGPASSWORD: bilimbi_dev_ca658ad7d8b5
      PGPORT: "5432"
      PGUSER: bilimbi

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: bilimbi_dev_ca658ad7d8b5
          POSTGRES_USER: bilimbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bilimbi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.3"
          version-type: strict

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-beam-tests-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run the project precommit suite
        run: mix precommit

      - name: Verify the precommit suite made no changes
        run: git diff --exit-code

  coordination_surface:
    name: Coordination surface
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse coordination writes to docs/ai-team
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          if [[ ",${LABELS}," == *",docs-onboarding,"* ]]; then
            echo "Label 'docs-onboarding' present; allowing the change."
            exit 0
          fi

          # Deletions are always fine -- removing coordination files is the goal.
          changed=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" -- 'docs/ai-team/**' || true)

          offending=$(printf '%s\n' "$changed" | grep -v '^$' \
            | grep -vE '^docs/ai-team/(README\.md|PORTING_STAGES\.md|research/)' || true)

          if [[ -n "$offending" ]]; then
            echo "::error::Coordination work does not belong in docs/ai-team."
            echo
            echo "These files are the onboarding surface only:"
            echo "  docs/ai-team/README.md"
            echo "  docs/ai-team/PORTING_STAGES.md"
            echo "  docs/ai-team/research/**"
            echo
            echo "Tasks, claims, handoffs, reviews, status and liveness belong in"
            echo "GitHub Issues; conversation belongs in Discussions. See"
            echo "docs/ai-team/README.md."
            echo
            echo "Offending paths:"
            printf '  %s\n' $offending
            echo
            echo "If this really is an onboarding change, add the 'docs-onboarding' label."
            exit 1
          fi

          echo "No coordination writes to docs/ai-team."
