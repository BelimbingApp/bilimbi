name: Native client

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-client-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  native-client:
    name: Bilimbi ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-26.04
            arch: amd64
            cgo: '0'
            executable: bilimbi
          - target: windows-amd64
            runner: windows-2025
            arch: amd64
            cgo: '0'
            executable: bilimbi.exe
          - target: darwin-arm64
            runner: macos-15
            arch: arm64
            cgo: '1'
            executable: bilimbi
          - target: darwin-amd64
            runner: macos-15
            arch: amd64
            cgo: '1'
            executable: bilimbi
    defaults:
      run:
        working-directory: clients/bilimbi-cli
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: clients/bilimbi-cli/go.sum
      - name: Test native client and packaging
        run: |
          go test ./...
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Check races
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build executable
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -trimpath -buildvcs=false -o "${RUNNER_TEMP}/${{ matrix.executable }}" .
      - name: Package local marketplace
        run: >-
          go run ./pack --root ../..
          --binary "${RUNNER_TEMP}/${{ matrix.executable }}"
          --target '${{ matrix.target }}'
          --output "${RUNNER_TEMP}/bilimbi-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bilimbi-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/bilimbi-${{ matrix.target }}.zip
            ${{ runner.temp }}/bilimbi-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
